name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test --all-targets
      - run: cargo test --doc
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo run --example basic
      - run: cargo run --release --example message_board -- --fresh
      - run: cargo run --release --example message_board -- --fresh --binary
      - run: cargo run --release --example message_board -- --binary

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74
      # Cargo 1.74 can't read a version 4 lockfile; resolve again instead.
      - run: rm Cargo.lock
      - run: cargo test
